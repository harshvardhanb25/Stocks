[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-optimization"
version = "0.1.0"
description = "Provider-independent portfolio analytics and optimization toolkit"
requires-python = ">=3.11"

dependencies = [
    "cvxpy>=1.8.1",
    "ipython>=8.12.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "yfinance>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "pre-commit",
    "jupyter"
]
india-data = [
    "python-dateutil>=2.8",
    "requests>=2.31",
]

[project.scripts]
portfolio-fetch-tri-history = "portfolio_optimizer.adapters.india.fetch_tri_history:main"
portfolio-build-index-proxies = "portfolio_optimizer.adapters.india.index_proxy:main"

[tool.setuptools.packages.find]
where = ["src"] 